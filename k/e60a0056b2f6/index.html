<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pruebas de Mara</title>
<style>
  :root { --grafito: #2A2F36; --fondo: #1D2126; --terra: #D9805F; --texto: #F3EFEA; --gris: #9AA1A9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(1200px 700px at 70% 20%, #343A43 0%, var(--fondo) 60%); color: var(--texto); font-family: Calibri, 'Segoe UI', system-ui, -apple-system, sans-serif; display: grid; place-items: center; padding: 16px; }
  .caja { width: 100%; max-width: 420px; text-align: center; }
  .mono { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--terra); color: var(--terra); display: grid; place-items: center; margin: 0 auto 28px; font: 700 16px Calibri, sans-serif; letter-spacing: .2em; }
  .mono svg { width: 26px; height: 26px; }
  h1 { font: 700 36px/1.15 Calibri, "Segoe UI", sans-serif; margin: 0 0 10px; letter-spacing: -.01em; }
  p { color: var(--gris); margin: 0 0 30px; font-size: 16px; line-height: 1.5; }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; color: var(--texto); font-size: 17px; padding: 14px 16px; outline: none; }
  input:focus { border-color: var(--terra); background: rgba(255,255,255,.09); }
  button { background: var(--terra); color: #1D2126; border: 0; border-radius: 12px; font-weight: 700; font-size: 16px; padding: 0 22px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { min-height: 24px; margin-top: 14px; color: #F0A585; font-size: 15px; }
  .pie { margin-top: 40px; font-size: 13px; color: #6B727A; }
  .temblor { animation: temblor .35s; }
  @keyframes temblor { 0%, 100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style>
</head>
<body>
<main class="caja">
  <div class="mono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div>
  <h1>Pruebas de Mara</h1>
  <p>Escriba la clave para abrirla.</p>
  <form id="f" autocomplete="off">
    <input id="c" type="password" placeholder="Clave" aria-label="Clave" autofocus>
    <button id="b" type="submit">Entrar</button>
  </form>
  <div class="err" id="e" role="alert"></div>
  <div class="pie">El contenido está cifrado: sin la clave no se puede leer.</div>
</main>

const bytes = (b64) => { const s = atob(b64), u = new Uint8Array(s.length); for (let k = 0; k < s.length; k++) u[k] = s.charCodeAt(k); return u; };
async function abrir(clave) {
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) throw new Error('navegador');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(DATOS.sal), iterations: DATOS.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATOS.iv) }, llave, bytes(DATOS.dat));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const c = document.getElementById('c'), b = document.getElementById('b'), e = document.getElementById('e');
  if (!c.value) return;
  b.disabled = true; b.textContent = 'Abriendo…'; e.textContent = '';
  try {
    const html = await abrir(c.value);
    document.open(); document.write(html); document.close();
  } catch (x) {
    b.disabled = false; b.textContent = 'Entrar';
    e.textContent = x && x.message === 'navegador' ? 'Este navegador no puede abrirla. Use Chrome, Edge o Safari actualizados.' : 'Clave incorrecta.';
    const caja = document.querySelector('.caja'); caja.classList.remove('temblor'); void caja.offsetWidth; caja.classList.add('temblor');
    c.select();
  }
});
